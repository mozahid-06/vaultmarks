<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vaultmarks</title>
    <link rel="stylesheet" href="library.css">
  </head>
  <body>
    <header class="topbar">
      <span class="wordmark">Vaultmarks</span>
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" spellcheck="false">
      <button id="open-settings" class="icon-button" type="button" title="Settings" aria-label="Settings"></button>
    </header>

    <div id="onboarding" class="center-panel" hidden>
      <h1>Vaultmarks</h1>
      <p id="onboarding-message" class="muted">Choose your Obsidian vault folder to start.</p>
      <button id="choose-folder" class="primary" type="button">Choose your Obsidian vault folder</button>
    </div>

    <div id="workspace" class="workspace" hidden>
      <aside id="sidebar" class="sidebar">
        <nav id="all" class="nav-list" aria-label="All bookmarks"></nav>
        <div class="sidebar-heading">
          <span>Collections</span>
          <button id="new-collection" class="icon-button" type="button" title="New collection" aria-label="New collection"></button>
        </div>
        <nav id="collections" class="nav-list" aria-label="Collections"></nav>
      </aside>

      <main class="main">
        <div id="reconnect" class="banner" hidden>
          <span>Vaultmarks lost access to your vault folder.</span>
          <button id="reconnect-folder" class="primary" type="button">Reconnect folder</button>
        </div>
        <div class="main-head">
          <h1 id="collection-title">All bookmarks</h1>
          <span id="summary" class="muted"></span>
          <button id="new-bookmark" class="primary" type="button">New bookmark</button>
        </div>
        <div id="list" class="list"></div>
        <p id="empty" class="empty" hidden></p>
      </main>
    </div>

    <dialog id="detail" class="dialog">
      <div id="detail-view">
        <img id="detail-cover" class="detail-cover" alt="" hidden>
        <h2 id="detail-heading"></h2>
        <a id="detail-link" class="muted detail-link" target="_blank" rel="noreferrer"></a>
        <p id="detail-date" class="muted"></p>
        <p id="detail-text" class="detail-text"></p>
        <div id="detail-chips" class="chips"></div>
        <dl class="settings-list">
          <dt>Collection</dt>
          <dd id="detail-collection-label"></dd>
        </dl>
        <div id="detail-status" class="dialog-status" role="status" aria-live="polite"></div>
        <div class="actions">
          <button id="detail-open" class="primary" type="button">Open</button>
          <button id="detail-copy" type="button">Copy link</button>
          <button id="detail-obsidian" type="button" hidden>Open in Obsidian</button>
          <button id="detail-edit" type="button">Edit</button>
          <button id="detail-move" type="button">Move to…</button>
          <button id="detail-delete" type="button">Delete</button>
          <button id="detail-close" type="button">Close</button>
        </div>
      </div>

      <form id="detail-form" hidden>
        <h2 id="detail-form-heading"></h2>
        <label class="field">
          <span class="field-label">Title</span>
          <input id="detail-title" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span class="field-label">URL</span>
          <input id="detail-url" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span class="field-label">Description</span>
          <textarea id="detail-description" rows="4"></textarea>
        </label>
        <div class="field">
          <span class="field-label">Tags</span>
          <div id="detail-tags" class="chips"></div>
          <input id="detail-tag-input" class="tag-input" type="text" placeholder="Add a tag…" autocomplete="off" spellcheck="false">
        </div>
        <label class="field">
          <span class="field-label">Collection</span>
          <select id="detail-collection"></select>
        </label>
        <div id="detail-form-status" class="dialog-status" role="status" aria-live="polite"></div>
        <div class="actions">
          <button id="detail-save" class="primary" type="submit">Save</button>
          <button id="detail-cancel" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings" class="dialog">
      <h2>Settings</h2>
      <div id="settings-body"></div>
    </dialog>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <script type="module" src="library.js"></script>
  </body>
</html>
