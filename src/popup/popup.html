<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vaultmarks</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="popup-header">
      <span class="wordmark">Vaultmarks</span>
      <button id="open-library" class="icon-button" type="button" title="Open library" aria-label="Open library"></button>
    </header>

    <section id="setup" class="panel" hidden>
      <p class="muted" id="setup-message">Choose your Obsidian vault folder once, then save pages with one click.</p>
      <button id="choose-folder" class="primary" type="button">Choose vault folder</button>
    </section>

    <form id="form" hidden>
      <img id="cover" class="cover" alt="" hidden>
      <label class="field">
        <span class="field-label">Title</span>
        <input id="title" type="text" autocomplete="off" spellcheck="false">
      </label>
      <output id="url" class="url"></output>
      <label class="field">
        <span class="field-label">Description</span>
        <textarea id="description" rows="3"></textarea>
      </label>
      <div class="field">
        <span class="field-label">Tags</span>
        <div id="tags" class="chips"></div>
        <input id="tag-input" class="tag-input" type="text" placeholder="Add a tag…" autocomplete="off" spellcheck="false">
      </div>
      <label class="field">
        <span class="field-label">Collection</span>
        <select id="collection"></select>
      </label>
      <div class="actions">
        <button id="save" class="primary" type="submit">Save bookmark</button>
      </div>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
